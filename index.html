<!DOCTYPE html>
<!-- ============================================================
  MY PLANNER 📋 — schedule + tasks for EVERYTHING you do.
  School, gym, work, projects, chores — one app for all of it.

  THE BIG LESSON (same as before, it never changes):
  Apps are LISTS FROM DATA. Your activities and tasks live in
  arrays of objects. When data changes, render() rebuilds the
  screen. Data → screen, always in that direction.

  Your data lives in memory while the app is open; the BACKUP
  tab turns it into JSON text you can copy and restore later.
============================================================= -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>My Planner</title>
<!-- PWA: makes the app installable with its own icon (needs the
     manifest.json, sw.js and icon files sitting next to this file) -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#171b2e">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: #0b0e1a;
    font-family: 'Segoe UI', system-ui, sans-serif;
    color: #eef0f8;
    display: flex; justify-content: center; align-items: center;
    min-height: 100vh;
  }
  #app {
    width: min(420px, 100vw);
    height: min(800px, 100vh);
    background: linear-gradient(180deg, #171b2e, #10131f);
    border-radius: 22px;
    display: flex; flex-direction: column;
    overflow: hidden;
    position: relative;          /* lets the tutorial overlay sit inside */
  }
  header { padding: 16px 18px 8px; display: flex; justify-content: space-between; align-items: flex-start; }
  h1 { font-size: 22px; }
  #helpBtn { background: #262b44; border: none; color: #7dc4ff;
             width: 30px; height: 30px; border-radius: 50%;
             font-weight: 800; font-size: 15px; cursor: pointer; }
  #dateLine { font-size: 13px; color: #8b92ad; margin-top: 2px; }

  nav {
    display: flex; border-top: 1px solid #262b44;
    background: #12152355;
  }
  nav button {
    flex: 1; background: none; border: none; color: #8b92ad;
    font-family: inherit; font-weight: 700; font-size: 13px;
    padding: 12px 0 14px; cursor: pointer;
  }
  nav button.active { color: #7dc4ff; }

  .page { flex: 1; overflow-y: auto; padding: 8px 16px 16px; display: none; }
  .page.active { display: block; }

  h2 { font-size: 14px; color: #8b92ad; text-transform: uppercase;
       letter-spacing: 1px; margin: 14px 0 8px; }

  .card {
    background: #1c2138; border-radius: 12px;
    padding: 10px 12px; margin-bottom: 8px;
    border-left: 5px solid #7dc4ff;
    display: flex; justify-content: space-between; align-items: center;
    gap: 8px;
  }
  .card .name { font-weight: 700; font-size: 15px; }
  .card .sub { font-size: 12px; color: #8b92ad; margin-top: 1px; }
  .badge { font-size: 11px; font-weight: 800; padding: 3px 8px;
           border-radius: 99px; background: #262b44; white-space: nowrap; }
  .badge.today   { background: #2e5c8c; color: #bfe0ff; }
  .badge.overdue { background: #7c2334; color: #ffb4c0; }
  .badge.done    { background: #1e4d33; color: #9be8b7; }

  .task-done .name { text-decoration: line-through; color: #8b92ad; }

  .xbtn { background: none; border: none; color: #566; font-size: 16px;
          cursor: pointer; padding: 4px; }
  .checkbtn { width: 26px; height: 26px; border-radius: 8px;
              border: 2px solid #3a4166; background: none; cursor: pointer;
              font-size: 14px; color: #9be8b7; flex-shrink: 0; }

  form { background: #161a2c; border-radius: 12px; padding: 10px;
         display: flex; flex-direction: column; gap: 7px; margin-bottom: 10px; }
  input, select {
    background: #10131f; color: #eef0f8;
    border: 1px solid #2c3352; border-radius: 8px;
    padding: 8px 10px; font-family: inherit; font-size: 13px;
  }
  form button {
    background: #2e8cdc; color: white; border: none; border-radius: 8px;
    padding: 9px; font-family: inherit; font-weight: 800; font-size: 13px;
    cursor: pointer;
  }
  .colorRow { display: flex; gap: 6px; }
  .colorRow button { flex: 1; height: 26px; border-radius: 8px; border: 2px solid transparent; }
  .colorRow button.picked { border-color: white; }

  textarea { width: 100%; height: 140px; background: #10131f; color: #9be8b7;
             border: 1px solid #2c3352; border-radius: 8px; padding: 8px;
             font-family: monospace; font-size: 11px; }
  .empty { color: #566; font-size: 13px; text-align: center; padding: 18px 0; }

  /* the due-date sliders */
  .sliderRow { display: flex; align-items: center; gap: 8px; }
  .sliderRow label { font-size: 11px; color: #8b92ad; width: 44px; }
  .sliderRow output { font-size: 12px; font-weight: 700; width: 34px; text-align: right; }
  input[type=range] {
    flex: 1; -webkit-appearance: none; appearance: none;
    height: 6px; border-radius: 3px; background: #2c3352;
    border: none; padding: 0;
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none; appearance: none;
    width: 18px; height: 18px; border-radius: 50%;
    background: #7dc4ff; cursor: pointer;

  input[type=range]::-moz-range-thumb {

    border-radius: 14px; padding: 14px;

  #tutTitle { font-size: 15px; font-weight: 800; color: #ffd54a; }

  #loginPage input {

    border: 1px solid #2c3352; border-radius: 10px;

  #signupBtn { background: #262b44; color: #7dc4ff; }

</head>

<body>
<div id="app">
  <header>
    <div>
      <h1>📋 My Planner</h1>
      <div id="dateLine"></div>
    </div>
    <div>

  <!-- ===== PAGE 1: TODAY ===== -->

<script type="module">
// ------------------------------------------------------------
// PART 0: GOOGLE SIGN-IN SETUP (Firebase) — OPTIONAL
//
// Google sign-in only works once your app (1) lives on the
// internet and (2) is registered with Google. The free way:
//   1. Put this file online with GitHub Pages (free hosting).
//   2. Go to console.firebase.google.com → Add project.
//   3. In the project: Build → Authentication → enable Google.
//      Add your GitHub Pages domain under "Authorized domains".
//   4. Build → Firestore Database → Create (start in test mode).
//   5. Project settings → your apps → Web app → copy the
//      firebaseConfig object and PASTE IT BELOW instead of null.
//
// Until you do that, this stays null and the app runs exactly
// as before with PIN accounts. Paste the config → the
// "Continue with Google" button appears and your data saves to
// the CLOUD (same account on your phone AND laptop!).
// ------------------------------------------------------------
const firebaseConfig = null; /* e.g.
const firebaseConfig = {
  apiKey: "...", authDomain: "myplanner-xxxx.firebaseapp.com",
  projectId: "myplanner-xxxx", appId: "..."
}; */

// ------------------------------------------------------------
// PART 1: THE DATA — the whole app is these two arrays.
// An "activity" is anything that repeats weekly (a class, gym,
// a shift, practice). A "task" is anything you must finish.
// ------------------------------------------------------------
const DAYS = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday', 'Sunday'];
const COLORS = ['#7dc4ff', '#9be8b7', '#ffd54a', '#ff8cb4', '#c88cff', '#ffab70'];

// sample data so the app isn't empty — replace with YOUR real life!
let activities = [
  { id: 1, name: 'Math class',  day: 'Monday',    time: '08:00', color: '#7dc4ff' },
  { id: 2, name: 'Gym',         day: 'Monday',    time: '17:30', color: '#9be8b7' },
  { id: 3, name: 'Game dev',    day: 'Tuesday',   time: '19:00', color: '#c88cff' },
  { id: 4, name: 'Football',    day: 'Saturday',  time: '10:00', color: '#ffd54a' },
];
let tasks = [
  { id: 1, title: 'Finish algebra worksheet', activityId: 1, due: todayPlus(1), time: '18:00', done: false },
  { id: 2, title: 'Publish Verity update',    activityId: 3, due: todayPlus(3), time: '20:00', done: false },
];
let nextId = 10;
let pickedColor = COLORS[0];

// ------------------------------------------------------------
// PART 1.5: THE CLEAN-LANGUAGE FILTER
// Harder than it sounds! People type "b4d" with numbers, or
// stretch letters ("baaaad"). And innocent words can CONTAIN
// rude ones — "class" contains "ass" (this is famously called
// the Scunthorpe problem, after a real UK town that filters
// kept blocking). So we do it in three steps:
//   1. normalize: lowercase, swap number-tricks back to letters
//      (4→a, 3→e, 0→o...), squash repeated letters
//   2. STRONG words: blocked even hidden inside other text
//   3. SHORT words: only blocked when they stand alone as a
//      whole word — so "class" and "assignment" stay allowed
// ------------------------------------------------------------
const BAD_STRONG = ['fuck','shit','bitch','cunt','dick','cock','pussy',
  'asshole','bastard','whore','slut','nigga','nigger','faggot','retard',
  // adult content — blocked anywhere in the text
  'porn','hentai','rape','penis','vagina','boob','nude','horny',
  'dildo','blowjob','nsfw','xxx','onlyfans','stripper','fetish'];
const BAD_ALONE = ['ass','hoe','tit','cum','fk','stfu','wtf',
  // adult words only blocked standing alone — so "Essex", "Sussex"
  // and "sextet" don't get caught (Scunthorpe strikes again)
  'sex','sexy','thot','simp','milf'];
// innocent words that CONTAIN rude ones — excuse them BEFORE checking,
// or the filter blocks real places and names (the Scunthorpe problem!)
const ALLOWED = ['scunthorpe','cocktail','hancock','peacock','dickens',
  'dickinson','shiitake','bassist','booboo','peekaboo'];

function leetSwap(text) {
  // undo the classic number/symbol disguises
  const swaps = { '4':'a', '@':'a', '3':'e', '1':'i', '!':'i', '0':'o', '5':'s', '$':'s', '7':'t' };
  return text.toLowerCase().replace(/[4@31!05$7]/g, ch => swaps[ch]);
}
function normalizeText(text) {
  return leetSwap(text).replace(/(.)\1{2,}/g, '$1'); // "baaaad" → "bad"
}

function hasBadWords(text) {
  // two versions: one with stretched letters squashed ("fuuuck"→"fuck")
  // and one WITHOUT squashing — because words like "xxx" ARE repeated
  // letters, and squashing would hide them from the check!
  let t = normalizeText(text);
  let tRaw = leetSwap(text);
  for (const okWord of ALLOWED) {
    t = t.replaceAll(okWord, ' ');                 // excuse the innocent words first
    tRaw = tRaw.replaceAll(okWord, ' ');
  }
  const squashed = t.replace(/[^a-z]/g, '');       // ignore spaces/dots between letters
  const squashedRaw = tRaw.replace(/[^a-z]/g, '');
  for (const w of BAD_STRONG) {
    if (squashed.includes(w) || squashedRaw.includes(w)) return true;
  }
  const words = t.split(/[^a-z]+/);                // split into whole words
  for (const w of BAD_ALONE) {
    if (words.includes(w)) return true;            // "ass" alone: no. "class": fine.
  }
  return false;
}

// ------------------------------------------------------------
// PART 2: DATE HELPERS
// ------------------------------------------------------------
function dateKey(d) {
  return d.getFullYear() + '-'
    + String(d.getMonth() + 1).padStart(2, '0') + '-'
    + String(d.getDate()).padStart(2, '0');
}
function todayKey() { return dateKey(new Date()); }
function todayPlus(days) {
  const d = new Date();
  d.setDate(d.getDate() + days);
  return dateKey(d);
}
function todayName() {
  // getDay(): Sunday=0, Monday=1, ... Saturday=6
  return ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'][new Date().getDay()];
}
function dueInfo(task) {
  if (task.done) return { label: 'Done ✓', cls: 'done' };
  if (task.due < todayKey()) return { label: 'OVERDUE!', cls: 'overdue' };
  if (task.due === todayKey()) return { label: 'Due today', cls: 'overdue' };
  if (task.due === todayPlus(1)) return { label: 'Due tomorrow', cls: 'today' };
  return { label: 'Due ' + task.due.slice(5), cls: '' };
}

// ------------------------------------------------------------
// PART 3: RENDER — data → screen. The heart of the app.
// ------------------------------------------------------------
function activityById(id) { return activities.find(a => a.id === id); }

function activityCard(a, showDay) {
  return '<div class="card" style="border-left-color:' + a.color + '">'
    + '<div><div class="name">' + a.name + '</div>'
    + '<div class="sub">' + (showDay ? a.day + ' · ' : '') + a.time + '</div></div>'
    + '<button class="xbtn" onclick="deleteActivity(' + a.id + ')">✕</button>'
    + '</div>';
}

function taskCard(task) {
  const a = activityById(task.activityId);
  const info = dueInfo(task);
  return '<div class="card ' + (task.done ? 'task-done' : '') + '" style="border-left-color:' + (a ? a.color : '#555') + '">'
    + '<button class="checkbtn" onclick="toggleTask(' + task.id + ')">' + (task.done ? '✓' : '') + '</button>'
    + '<div style="flex:1"><div class="name">' + task.title + '</div>'
    + '<div class="sub">' + (a ? a.name : 'General') + (task.time ? ' · ' + task.time : '') + '</div></div>'
    + '<span class="badge ' + info.cls + '">' + info.label + '</span>'
    + '<button class="xbtn" onclick="deleteTask(' + task.id + ')">✕</button>'
    + '</div>';
}

function render() {
  document.getElementById('dateLine').textContent =
    todayName() + ', ' + new Date().toLocaleDateString();

  // ---- TODAY page ----
  const todays = activities
    .filter(a => a.day === todayName())
    .sort((a, b) => a.time < b.time ? -1 : 1);
  document.getElementById('todayActivities').innerHTML =
    todays.length ? todays.map(a => activityCard(a, false)).join('')
                  : '<div class="empty">Nothing scheduled today 🎉</div>';

  // sorting by (due + time) works because "2026-07-26" + "18:00"
  // glued together still sorts alphabetically = chronologically!
  const soon = tasks
    .filter(t => !t.done)
    .sort((a, b) => (a.due + (a.time || '')) < (b.due + (b.time || '')) ? -1 : 1)
    .slice(0, 5);
  document.getElementById('todayTasks').innerHTML =
    soon.length ? soon.map(taskCard).join('')
                : '<div class="empty">Nothing due. Legend. 😎</div>';

  // ---- SCHEDULE page: all 7 days ----
  let week = '';
  for (const day of DAYS) {
    const list = activities.filter(a => a.day === day).sort((a, b) => a.time < b.time ? -1 : 1);
    week += '<h2>' + day + '</h2>';
    week += list.length ? list.map(a => activityCard(a, false)).join('')
                        : '<div class="empty">free day</div>';
  }
  document.getElementById('weekList').innerHTML = week;

  // ---- TASKS page: not-done first, then by due date ----
  const sorted = [...tasks].sort((a, b) =>
    (a.done - b.done) || ((a.due + (a.time || '')) < (b.due + (b.time || '')) ? -1 : 1));
  document.getElementById('taskList').innerHTML =
    sorted.length ? sorted.map(taskCard).join('')
                  : '<div class="empty">No tasks yet.</div>';

  // keep the task form's activity dropdown in sync
  document.getElementById('taskActivity').innerHTML =
    activities.map(a => '<option value="' + a.id + '">' + a.name + '</option>').join('');

  // ---- BACKUP page ----
  document.getElementById('backupBox').value =
    JSON.stringify({ activities: activities, tasks: tasks, nextId: nextId }, null, 1);

  // AUTOSAVE: every render means the data just changed — so we
  // save the logged-in user's data right here. One hook, zero
  // "did I remember to save?" bugs.
  persist();
}

// ------------------------------------------------------------
// PART 4: ACTIONS — change the DATA, then render(). Always.
// ------------------------------------------------------------
function deleteActivity(id) {
  activities = activities.filter(a => a.id !== id);
  tasks = tasks.filter(t => t.activityId !== id);
  render();
}
function deleteTask(id) {
  tasks = tasks.filter(t => t.id !== id);
  render();
}
function toggleTask(id) {
  const t = tasks.find(t => t.id === id);
  if (t) t.done = !t.done;
  render();
}

document.getElementById('activityForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const name = document.getElementById('activityName').value.trim();
  if (!name) return;
  if (hasBadWords(name)) {
    document.getElementById('activityName').value = '';
    document.getElementById('activityName').placeholder = "Let's keep it clean 😅";
    return;
  }
  activities.push({
    id: nextId++,
    name: name,
    day: document.getElementById('activityDay').value,
    time: document.getElementById('activityTime').value,
    color: pickedColor,
  });
  document.getElementById('activityName').value = '';
  render();
});

document.getElementById('taskForm').addEventListener('submit', (e) => {
  e.preventDefault();
  const title = document.getElementById('taskTitle').value.trim();
  if (!title || activities.length === 0) return;
  if (hasBadWords(title)) {
    document.getElementById('taskTitle').value = '';
    document.getElementById('taskTitle').placeholder = "Let's keep it clean 😅";
    return;
  }
  tasks.push({
    id: nextId++,
    title: title,
    activityId: Number(document.getElementById('taskActivity').value),
    due: dueFromSliders(),       // built from the three sliders
    time: document.getElementById('taskTime').value || '',
    done: false,
  });
  document.getElementById('taskTitle').value = '';
  render();
});

document.getElementById('copyBtn').addEventListener('click', () => {
  const box = document.getElementById('backupBox');
  box.select();
  document.execCommand('copy');
});
document.getElementById('restoreBtn').addEventListener('click', () => {
  try {
    const data = JSON.parse(document.getElementById('backupBox').value);
    activities = data.activities; tasks = data.tasks; nextId = data.nextId;
    render();
  } catch (err) {
    alert('Hmm, that text is not valid backup data.');
  }
});

// ------------------------------------------------------------
// PART 6: THE DUE-DATE SLIDERS
// Three range inputs = day, month, year. The clever bits:
//  • months have different lengths, so the DAY slider's max
//    changes when you move the MONTH or YEAR slider.
//    Calendar trick: new Date(year, month, 0).getDate() gives
//    you how many days that month has (handles leap years too!)
//  • the 'input' event fires WHILE you drag, so the preview
//    updates live under your finger.
// ------------------------------------------------------------
const MONTH_NAMES = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const dueDay = document.getElementById('dueDay');
const dueMonth = document.getElementById('dueMonth');
const dueYear = document.getElementById('dueYear');

// year slider covers this year up to 2 years ahead
const thisYear = new Date().getFullYear();
dueYear.min = thisYear;
dueYear.max = thisYear + 2;

function daysInMonth(year, month) {          // month here is 1..12
  return new Date(year, month, 0).getDate(); // day 0 of NEXT month = last day of this one
}

function dueFromSliders() {
  return dueYear.value + '-'
    + String(dueMonth.value).padStart(2, '0') + '-'
    + String(dueDay.value).padStart(2, '0');
}

function updateDueSliders() {
  // shrink/grow the day slider to fit the chosen month
  const maxDay = daysInMonth(Number(dueYear.value), Number(dueMonth.value));
  dueDay.max = maxDay;
  if (Number(dueDay.value) > maxDay) dueDay.value = maxDay; // 31 Feb? clamp to 28/29

  // update the little numbers next to each slider
  document.getElementById('dueDayOut').textContent = dueDay.value;
  document.getElementById('dueMonthOut').textContent = MONTH_NAMES[dueMonth.value - 1];
  document.getElementById('dueYearOut').textContent = dueYear.value;

  // live preview sentence, with the weekday name for free
  const d = new Date(Number(dueYear.value), Number(dueMonth.value) - 1, Number(dueDay.value));
  const weekday = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][d.getDay()];
  document.getElementById('duePreview').textContent =
    'Due: ' + weekday + ' ' + dueDay.value + ' ' + MONTH_NAMES[dueMonth.value - 1]
    + ' ' + dueYear.value + ' at ' + (document.getElementById('taskTime').value || '--:--');
}

// 'input' fires continuously while dragging — that's the live feel
dueDay.addEventListener('input', updateDueSliders);
dueMonth.addEventListener('input', updateDueSliders);
dueYear.addEventListener('input', updateDueSliders);
document.getElementById('taskTime').addEventListener('input', updateDueSliders);

// start the sliders on TOMORROW (a sensible default due date)
const tmrw = new Date();
tmrw.setDate(tmrw.getDate() + 1);
dueYear.value = tmrw.getFullYear();
dueMonth.value = tmrw.getMonth() + 1;
dueDay.value = tmrw.getDate();
updateDueSliders();

// ------------------------------------------------------------
// PART 8: ACCOUNTS — login, signup, and automatic saving.
//
// The browser gives every website a small storage drawer called
// localStorage: text that SURVIVES closing the app. We keep all
// accounts in one drawer entry: { username: {pin, data, seenTut} }.
//
// Two honest notes, developer to developer:
// 1. Some places (like previews) BLOCK the drawer, so every use
//    is wrapped in try/catch and we fall back to memory-only.
//    The app must never crash just because storage said no.
// 2. This is NOT real security — the PIN lives on this device,
//    unencrypted. It keeps siblings out of your planner; it would
//    not keep hackers out of a bank. Real logins live on servers.
// ------------------------------------------------------------
const USERS_KEY = 'myPlannerUsers';
let memUsers = {};          // fallback if the storage drawer is blocked
let storageOK = false;
try {
  localStorage.setItem('__test', '1');
  localStorage.removeItem('__test');
  storageOK = true;
} catch (e) { storageOK = false; }

function getUsers() {
  if (storageOK) {
    try { return JSON.parse(localStorage.getItem(USERS_KEY) || '{}'); }
    catch (e) { return {}; }
  }
  return memUsers;
}
function saveUsers(users) {
  if (storageOK) {
    try { localStorage.setItem(USERS_KEY, JSON.stringify(users)); return; }
    catch (e) {}
  }
  memUsers = users;
}

let currentUser = null;
let cloudSave = null;   // set by the Google/Firebase code when signed in

// the alarm preferences — saved with the rest of your data
let alarmCfg = { enabled: true, sound: 'beep', volume: 0.6, before: 5 };

// called by render() after every change: quietly saves your data
function persist() {
  if (cloudSave) { cloudSave(); return; }   // cloud users save to the cloud
  if (!currentUser) return;
  const users = getUsers();
  if (!users[currentUser]) return;
  users[currentUser].data = { activities: activities, tasks: tasks, nextId: nextId, alarm: alarmCfg };
  saveUsers(users);
}

const loginPage = document.getElementById('loginPage');
const loginMsg = document.getElementById('loginMsg');

function enterApp(username, firstTime) {
  currentUser = username;
  const users = getUsers();
  const saved = users[username].data;
  if (saved) {                     // returning user → restore their world
    activities = saved.activities;
    tasks = saved.tasks;
    nextId = saved.nextId;
    if (saved.alarm) alarmCfg = saved.alarm;
  }
  refreshSettingsUI();
  document.getElementById('pinSection').style.display = 'block';
  loginPage.classList.add('off');
  document.getElementById('dateLine').textContent = '';
  render();
  if (firstTime) {                 // only brand-new users get the tour
    startTutorial();
    users[username].seenTut = true;
    saveUsers(users);
  }
}

// ------------------------------------------------------------
// PART 9: GOOGLE SIGN-IN + CLOUD SAVING (activates only when
// you paste your firebaseConfig in PART 0 at the top).
//
// How it works when active:
//  • signInWithPopup opens Google's own login window — your app
//    NEVER sees the password, Google just hands back "this is
//    definitely osama@gmail.com". That's real authentication.
//  • Your data saves to Firestore (Google's cloud database) at
//    planners/<your-uid> — so the same account works on every
//    device. cloudSave plugs into the same persist() hook.
// ------------------------------------------------------------
async function initCloud() {
  if (!firebaseConfig) {
    // show the button anyway — hidden features confuse users.
    // Clicking it explains what's needed instead of doing nothing.
    const gBtn = document.getElementById('googleBtn');
    gBtn.style.display = 'block';
    gBtn.addEventListener('click', () => {
      loginMsg.style.color = '#bfe0ff';
      loginMsg.textContent =
        'Google login needs a one-time setup: host this app online, then follow the 5 steps written at the top of the code (Firebase). Until then, use a PIN account!';
    });
    return;
  }
  try {
    // dynamic import = only download Firebase if we actually need it
    const appMod = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    const authMod = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js');
    const dbMod = await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');

    const fbApp = appMod.initializeApp(firebaseConfig);
    const auth = authMod.getAuth(fbApp);
    const db = dbMod.getFirestore(fbApp);
    const googleBtn = document.getElementById('googleBtn');
    googleBtn.style.display = 'block';

    // one function that saves your world to the cloud
    async function saveToCloud(uid) {
      try {
        await dbMod.setDoc(dbMod.doc(db, 'planners', uid),
          { activities: activities, tasks: tasks, nextId: nextId, alarm: alarmCfg });
      } catch (e) { /* offline? next change will try again */ }
    }

    async function enterCloudApp(user) {
      // load this Google account's saved planner (if any)
      try {
        const snap = await dbMod.getDoc(dbMod.doc(db, 'planners', user.uid));
        if (snap.exists()) {
          const saved = snap.data();
          activities = saved.activities; tasks = saved.tasks; nextId = saved.nextId;
          if (saved.alarm) alarmCfg = saved.alarm;
        }
      } catch (e) {}
      currentUser = null;                         // not a PIN account
      cloudSave = () => saveToCloud(user.uid);    // plug into persist()
      refreshSettingsUI();
      // Google accounts have no PIN — hide that section of settings
      document.getElementById('pinSection').style.display = 'none';
      loginPage.classList.add('off');
      render();
      startTutorial();
    }

    googleBtn.addEventListener('click', async () => {
      try {
        const provider = new authMod.GoogleAuthProvider();
        const result = await authMod.signInWithPopup(auth, provider);
        enterCloudApp(result.user);
      } catch (e) {
        loginMsg.textContent = 'Google sign-in failed: ' + (e.code || e.message);
      }
    });

    // already signed in from last time? go straight in
    authMod.onAuthStateChanged(auth, (user) => {
      if (user && !cloudSave) enterCloudApp(user);
    });
  } catch (e) {
    // Firebase couldn't load (blocked network, typo in config...)
    document.getElementById('storageNote').textContent =
      'Could not reach Google services here — PIN accounts still work fine.';
  }
}
// ------------------------------------------------------------
// PART 10: SETTINGS + ALARMS ⏰
//
// The alarm sound is GENERATED BY CODE using the Web Audio API —
// no sound files needed. An oscillator makes a tone at a
// frequency (Hz); we switch it on and off in patterns to make
// beeps, chimes and sirens.
//
// The alarm engine checks the clock every 15 seconds: any task
// due today at a set time, or any activity scheduled today,
// fires an alarm "before" minutes early. Each one fires ONCE
// per day (we remember fired ones in a Set), and Snooze pushes
// it 5 minutes into the future.
// ------------------------------------------------------------
const settingsPage = document.getElementById('settingsPage');
const alarmOverlay = document.getElementById('alarmOverlay');

// --- sound generation ---
let audioCtx = null;
function getAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
// play one tone: frequency (Hz), start delay (s), length (s)
function tone(freq, delay, len, wave) {
  const ctx = getAudio();
  const osc = ctx.createOscillator();
  const gain = ctx.createGain();
  osc.type = wave || 'square';
  osc.frequency.value = freq;
  gain.gain.value = alarmCfg.volume * 0.5;
  osc.connect(gain); gain.connect(ctx.destination);
  osc.start(ctx.currentTime + delay);
  osc.stop(ctx.currentTime + delay + len);
}
// one round of the chosen alarm sound
function playAlarmPattern() {
  if (alarmCfg.sound === 'chime') {
    tone(523, 0, 0.25, 'sine'); tone(659, 0.25, 0.25, 'sine'); tone(784, 0.5, 0.45, 'sine');
  } else if (alarmCfg.sound === 'siren') {
    tone(600, 0, 0.4, 'sawtooth'); tone(900, 0.4, 0.4, 'sawtooth');
  } else { // beep
    tone(880, 0, 0.15); tone(880, 0.3, 0.15); tone(880, 0.6, 0.15);
  }
}

// --- the alarm overlay ---
let alarmLoop = null;
let activeAlarmKey = null;
const firedAlarms = new Set();       // keys that already rang today
const snoozedUntil = {};             // key → timestamp to ring again

function showAlarm(title, sub, key) {
  activeAlarmKey = key;
  document.getElementById('alarmTitle').textContent = title;
  document.getElementById('alarmSub').textContent = sub;
  alarmOverlay.classList.add('on');
  playAlarmPattern();
  alarmLoop = setInterval(playAlarmPattern, 1400);  // keep ringing
}
function stopAlarm() {
  alarmOverlay.classList.remove('on');
  if (alarmLoop) { clearInterval(alarmLoop); alarmLoop = null; }
}
document.getElementById('alarmDismiss').addEventListener('click', () => {
  firedAlarms.add(activeAlarmKey);   // done — won't ring again today
  stopAlarm();
});
document.getElementById('alarmSnooze').addEventListener('click', () => {
  snoozedUntil[activeAlarmKey] = Date.now() + 5 * 60 * 1000;  // +5 minutes
  stopAlarm();
});

// --- the engine: is it time for anything? ---
function toMinutes(hhmm) {           // "18:30" → 1110
  const parts = hhmm.split(':');
  return Number(parts[0]) * 60 + Number(parts[1]);
}
function checkAlarms() {
  if (!alarmCfg.enabled) return;
  if (!currentUser && !cloudSave) return;          // not logged in
  if (alarmOverlay.classList.contains('on')) return; // one at a time
  const now = new Date();
  const nowMin = now.getHours() * 60 + now.getMinutes();
  const today = todayKey();

  const candidates = [];
  for (const t of tasks) {
    if (!t.done && t.due === today && t.time) {
      candidates.push({ key: 'task-' + t.id + '-' + today, min: toMinutes(t.time),
        title: t.title, sub: 'Due at ' + t.time });
    }
  }
  for (const a of activities) {
    if (a.day === todayName() && a.time) {
      candidates.push({ key: 'act-' + a.id + '-' + today, min: toMinutes(a.time),
        title: a.name, sub: 'Starts at ' + a.time });
    }
  }

  for (const c of candidates) {
    if (firedAlarms.has(c.key)) continue;                     // already handled
    if (snoozedUntil[c.key] && Date.now() < snoozedUntil[c.key]) continue; // snoozing
    const ringAt = c.min - alarmCfg.before;
    // ring from "before-time" until 15 min after the real time
    // (so opening the app a little late still reminds you)
    if (nowMin >= ringAt && nowMin <= c.min + 15) {
      delete snoozedUntil[c.key];
      showAlarm('⏰ ' + c.title, c.sub, c.key);
      return;                                                  // one alarm per check
    }
  }
}
setInterval(checkAlarms, 15000);     // look at the clock every 15 seconds

// --- settings open/close + controls ---
function refreshSettingsUI() {
  document.getElementById('alarmEnabled').checked = alarmCfg.enabled;
  document.getElementById('alarmSound').value = alarmCfg.sound;
  document.getElementById('alarmVolume').value = alarmCfg.volume * 100;
  document.getElementById('alarmBefore').value = alarmCfg.before;
  document.getElementById('alarmBeforeOut').textContent = alarmCfg.before + ' min';
}
document.getElementById('settingsBtn').addEventListener('click', () => {
  refreshSettingsUI();
  settingsPage.classList.add('on');
});
document.getElementById('closeSettings').addEventListener('click', () => {
  settingsPage.classList.remove('on');
});
document.getElementById('alarmEnabled').addEventListener('change', (e) => {
  alarmCfg.enabled = e.target.checked; persist();
});
document.getElementById('alarmSound').addEventListener('change', (e) => {
  alarmCfg.sound = e.target.value; persist();
});
document.getElementById('alarmVolume').addEventListener('input', (e) => {
  alarmCfg.volume = Number(e.target.value) / 100; persist();
});
document.getElementById('alarmBefore').addEventListener('input', (e) => {
  alarmCfg.before = Number(e.target.value);
  document.getElementById('alarmBeforeOut').textContent = alarmCfg.before + ' min';
  persist();
});
document.getElementById('testAlarmBtn').addEventListener('click', playAlarmPattern);

// --- change PIN (PIN accounts only) ---
document.getElementById('changePinBtn').addEventListener('click', () => {
  const pinMsg = document.getElementById('pinMsg');
  if (!currentUser) return;
  const users = getUsers();
  const cur = document.getElementById('curPin').value;
  const next = document.getElementById('newPin').value;
  if (users[currentUser].pin !== cur) {
    pinMsg.style.color = '#ffb4c0'; pinMsg.textContent = 'Current PIN is wrong.'; return;
  }
  if (next.length < 4) {
    pinMsg.style.color = '#ffb4c0'; pinMsg.textContent = 'New PIN needs 4+ characters.'; return;
  }
  users[currentUser].pin = next;
  saveUsers(users);
  document.getElementById('curPin').value = '';
  document.getElementById('newPin').value = '';
  pinMsg.style.color = '#9be8b7'; pinMsg.textContent = 'PIN changed ✓';
});

initCloud();

// register the service worker (the PWA helper) — safely, as always:
// if it's not supported or the file is missing, the app doesn't care
if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(() => {});
}

render();   // paints the app behind the login screen
</script>
</body>
</html>
